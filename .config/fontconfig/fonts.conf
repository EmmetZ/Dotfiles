<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <!--
   用户字体规则已拆分到 ~/.config/fontconfig/conf.d/*.conf：
     50-reject-fonts.conf    屏蔽 URW/Nimbus 派生字体
     51-default-family.conf  无衬线、衬线与 system-ui 的优先字体栈
     51-kitty.conf           Kitty 专用的等宽中文与图标回退
     52-lang-variant.conf    按语言选择 CJK 异体字
     53-override.conf        按语言调整 CJK 字体的西文回退
     54-render.conf          渲染参数
   通用等宽字体不设置全局强制映射，沿用应用／网页的字体列表和系统默认回退。
   Kitty 的 monospace 查询单独恢复终端字体链，不影响浏览器的字体选择。
   浏览器最终字体需通过 Rendered Fonts 检查，不能仅根据 fc-match 判断。
   /etc/fonts/conf.d/50-user.conf 会先加载 conf.d，再加载本文件，
   因此本文件不要再 include conf.d，否则规则会被应用两次。
 -->
</fontconfig>
