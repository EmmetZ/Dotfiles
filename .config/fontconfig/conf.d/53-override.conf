<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <description>西文覆盖（按语言前置西文）</description>

 <!--
   把西文字体前置到 CJK 字体之前，让西文使用 Noto Sans / Noto Serif 的字形。
   只在「语言集合不含 zh/ja/ko」时生效，因此中文文本仍由 CJK 字体提供全角引号。
   注意不要用 <test name="lang" compare="contains"><string>en</string></test>：
   pattern 通常同时带有一个弱绑定的 "en"，那样写会对所有语言都成立（实测如此）。
 -->
 <match target="pattern">
  <test qual="all" name="lang" compare="not_contains"><string>zh</string></test>
  <test qual="all" name="lang" compare="not_contains"><string>ja</string></test>
  <test qual="all" name="lang" compare="not_contains"><string>ko</string></test>
  <test name="family" compare="contains"><string>Noto Sans CJK</string></test>
  <edit name="family" mode="prepend" binding="strong">
   <string>Noto Sans</string>
  </edit>
 </match>
 <match target="pattern">
  <test qual="all" name="lang" compare="not_contains"><string>zh</string></test>
  <test qual="all" name="lang" compare="not_contains"><string>ja</string></test>
  <test qual="all" name="lang" compare="not_contains"><string>ko</string></test>
  <test name="family" compare="contains"><string>Noto Serif CJK</string></test>
  <edit name="family" mode="prepend" binding="strong">
   <string>Noto Serif</string>
  </edit>
 </match>

</fontconfig>
