<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <description>屏蔽 URW/Nimbus 派生字体</description>

 <!--
   屏蔽 URW/Nimbus 及 TeX Gyre Heros 派生字体，避免它们成为网页西文字体的替代项。
   这里只限制 Fontconfig 的字体选择，不删除字体文件；按具体文件路径加载字体不受影响。
 -->
 <selectfont>
  <rejectfont>
   <pattern><patelt name="family"><string>Nimbus Sans</string></patelt></pattern>
   <pattern><patelt name="family"><string>Nimbus Sans L</string></patelt></pattern>
   <pattern><patelt name="family"><string>Vn Nimbus Sans L</string></patelt></pattern>
   <pattern><patelt name="family"><string>NimbusSanL</string></patelt></pattern>
   <pattern><patelt name="family"><string>TeX Gyre Heros</string></patelt></pattern>
   <pattern><patelt name="family"><string>TeX Gyre Heros Cn</string></patelt></pattern>
  </rejectfont>
 </selectfont>
</fontconfig>
