<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <description>通用字体族（sans-serif / serif / system-ui）的优先字体栈</description>

 <!--
   说明：target="pattern" 下 mode="prepend" 的语义是「插入到匹配到的那个值之前」，
   而不是插到列表最前面（插到最前面要用 prepend_first）。
   因此字体栈会落在「程序请求的具体字体」之后、「通用族名」之前，不会覆盖程序指定的字体。
 -->

 <!-- system-ui 必须最先处理：先补入 sans-serif，再由后面的规则补栈 -->
 <match target="pattern">
  <test name="family"><string>system-ui</string></test>
  <edit name="family" mode="prepend" binding="strong">
   <string>sans-serif</string>
  </edit>
 </match>

 <!-- 无衬线：中文字体在前，中文文本使用中文字形与全角引号；
      西文由 53-override.conf 按语言（非 zh/ja/ko）前置 Noto Sans -->
 <match target="pattern">
  <test name="family" qual="any"><string>sans-serif</string></test>
  <edit name="family" mode="prepend" binding="strong">
   <string>Noto Sans CJK SC</string>
   <string>Noto Sans</string>
   <string>Noto Color Emoji</string>
   <string>Noto Sans Symbols</string>
   <string>Noto Sans Symbols 2</string>
   <string>Twemoji Mozilla</string>
   <string>Symbols Nerd Font</string>
   <string>Arial</string>
  </edit>
 </match>

 <!-- 衬线 -->
 <match target="pattern">
  <test name="family" qual="any"><string>serif</string></test>
  <edit name="family" mode="prepend" binding="strong">
   <string>Noto Serif CJK SC</string>
   <string>Noto Serif</string>
   <string>Noto Color Emoji</string>
   <string>Noto Sans Symbols</string>
   <string>Noto Sans Symbols 2</string>
   <string>Twemoji Mozilla</string>
   <string>Symbols Nerd Font</string>
  </edit>
 </match>

 <!-- 等宽字体不设置全局覆盖；Kitty 专用回退见 51-kitty.conf。 -->
</fontconfig>
