<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <description>渲染参数：显式设置 hintstyle</description>

 <!-- 会话为 Wayland + 1.5 倍分数缩放，子像素渲染（rgba）与 LCD filter 基本不生效，
      故不再设置；antialias=true 是默认值，hinting=true 由 hintstyle 决定，均无需重复声明。 -->
 <match target="font">
  <edit name="hintstyle" mode="assign">
   <const>hintslight</const>
  </edit>
 </match>
</fontconfig>
