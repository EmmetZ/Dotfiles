<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <description>Kitty 专用等宽字体回退</description>

 <!-- Kitty 的中文缺字回退单独查询 monospace，不沿用 font_family 的字体列表。
      仅为 Kitty 恢复代码字体、等宽中文、图标和 emoji 的优先级。
      必须在 52-lang-variant.conf 之前加载，让 CJK 字形继续按语言切换。 -->
 <match target="pattern">
  <test name="prgname" compare="eq"><string>kitty</string></test>
  <test name="family" qual="any"><string>monospace</string></test>
  <edit name="family" mode="prepend" binding="strong">
   <string>FiraCode Nerd Font</string>
   <string>Noto Sans Mono CJK SC</string>
   <string>Symbols Nerd Font</string>
   <string>Noto Color Emoji</string>
   <string>Noto Emoji</string>
  </edit>
 </match>
</fontconfig>
