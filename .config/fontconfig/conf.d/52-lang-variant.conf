<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <description>按语言选择 CJK 异体字（zh-TW / zh-HK / ja / ko）</description>

 <!-- 无语言或语言为 en 时，sans-serif/serif 栈以 Noto * CJK SC 为默认 -->
 <match target="pattern">
  <test name="lang">
   <string>zh-HK</string>
  </test>
  <test name="family">
   <string>Noto Sans CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Sans CJK HK</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>zh-HK</string>
  </test>
  <test name="family">
   <string>Noto Serif CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <!-- Noto Serif CJK 未提供 HK 字体族，使用 TC 字形。 -->
   <string>Noto Serif CJK TC</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>zh-HK</string>
  </test>
  <test name="family">
   <string>Noto Sans Mono CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Sans Mono CJK HK</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>zh-TW</string>
  </test>
  <test name="family">
   <string>Noto Sans CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Sans CJK TC</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>zh-TW</string>
  </test>
  <test name="family">
   <string>Noto Serif CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Serif CJK TC</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>zh-TW</string>
  </test>
  <test name="family">
   <string>Noto Sans Mono CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Sans Mono CJK TC</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>ja</string>
  </test>
  <test name="family">
   <string>Noto Sans CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Sans CJK JP</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>ja</string>
  </test>
  <test name="family">
   <string>Noto Serif CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Serif CJK JP</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>ja</string>
  </test>
  <test name="family">
   <string>Noto Sans Mono CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Sans Mono CJK JP</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>ko</string>
  </test>
  <test name="family">
   <string>Noto Sans CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Sans CJK KR</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>ko</string>
  </test>
  <test name="family">
   <string>Noto Serif CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Serif CJK KR</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang">
   <string>ko</string>
  </test>
  <test name="family">
   <string>Noto Sans Mono CJK SC</string>
  </test>
  <edit binding="strong" name="family">
   <string>Noto Sans Mono CJK KR</string>
  </edit>
 </match>
</fontconfig>
