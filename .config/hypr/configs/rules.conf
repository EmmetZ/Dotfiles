# windowrule Position
windowrule = center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)
windowrule = center on, workspace 7, float on, size (monitor_w*0.6) (monitor_h*0.7), match:class ^([Ww]hatsapp-for-linux)$
windowrule = center on, workspace 7, float on, size (monitor_w*0.6) (monitor_h*0.7), match:class ^([Ff]erdium)$

# WINDOWRULE v2
# windowrule v2 - position
# windowrule = center,floating:1 # warning, it cause even the menu to float and center.
windowrule = center on, float on, match:class ([Tt]hunar), match:title (File Operation Progress)
windowrule = center on, float on, match:class ([Tt]hunar), match:title (Confirm to replace files)
windowrule = center on, float on, size (monitor_w*0.6) (monitor_h*0.7), match:title ^(ROG Control)$
windowrule = move ((monitor_w*0.72)) ((monitor_h*0.07)), float on, size (monitor_w*0.25) (monitor_h*0.25), pin on, match:title ^(Picture-in-Picture)$
#windowrule = move 72% 7%,title:^(Firefox)$ 

# windowrule v2 to avoid idle for fullscreen apps
windowrule = idle_inhibit fullscreen, match:class ^(*)$
windowrule = idle_inhibit fullscreen, match:title ^(*)$
windowrule = idle_inhibit fullscreen, no_dim on, match:fullscreen 1

# windowrule v2 move to workspace
# windowrule = workspace 1, class:^([Tt]hunderbird)$
# windowrule = workspace 2, class:^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr)$
# windowrule = workspace 2, class:^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable)?)$
# windowrule = workspace 2, class:^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
# windowrule = workspace 3, class:^([Tt]hunar)$
# windowrule = workspace 4, class:^(com.obsproject.Studio)$
# windowrule = workspace 5, class:^([Ss]team)$
windowrule = workspace 5, match:class ^([Ll]utris)$
windowrule = workspace 7, match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$

# windowrule v2 move to workspace (silent)
windowrule = workspace 6 silent, match:class ^(virt-manager)$
windowrule = workspace 9 silent, match:class ^([Aa]udacious)$

# windowrule v2 - float
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float on, match:class ([Zz]oom|onedriver|onedriver-launcher)$
windowrule = float on, match:class (xdg-desktop-portal-gtk)
windowrule = float on, match:class (org.gnome.Calculator), match:title (Calculator)
windowrule = float on, match:class (codium|codium-url-handler|VSCodium), match:title (Add Folder to Workspace)
windowrule = float on, match:class ^([Rr]ofi)$
windowrule = float on, match:class ^(eog|org.gnome.Loupe|org.kde.gwenview)$ # image viewer
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = float on, match:class ^(nwg-look|qt5ct|qt6ct)$
windowrule = float on, match:class ^(mpv|com.github.rafostar.Clapper)$
windowrule = float on, match:class ^(nm-applet|nm-connection-editor|blueman-manager)$
windowrule = float on, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor)$ # system monitor
windowrule = float on, match:class ^(yad)$ # icon browser
windowrule = float on, match:class ^(wihotspot(-gui)?)$ # wifi hotspot
windowrule = float on, match:class ^(org.gnome.Evince|org.kde.okular)$ # document viewer
windowrule = float on, match:class ^(file-roller|org.gnome.FileRoller)$ # archive manager
windowrule = float on, match:class ^([Bb]aobab|org.gnome.[Bb]aobab)$ # Disk usage analyzer
windowrule = float on, size (monitor_w*0.6) (monitor_h*0.7), match:title (Kvantum Manager)
windowrule = float on, match:class ^([Ss]team)$, match:title ^((?![Ss]team).*|[Ss]team [Ss]ettings)$
windowrule = float on, match:class ^([Qq]alculate-gtk)$
