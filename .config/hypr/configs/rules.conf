# wechat
windowrule = float on, center on, match:class ^([Ww]echat)$, match:title 微信(.*)
windowrule = float on, center on, match:class ^([Ww]echat)$, match:title 预览
windowrule = float on, center on, match:class ^([Ww]echat)$, match:title 朋友圈
windowrule = float on, match:class ^([Ww]echat)$, match:title 图片编辑
windowrule = float on, center on, match:class ^([Ww]echat)$, match:title 图片和视频
# windowrule = size 65% 70%, class:^([Ww]echat)$, title:^(微信)$
windowrule = center on, match:class ^([Ww]echat)$, match:title 设置
# windowrule = opacity 0.95 0.95, class:^([Ww]echat)$, title:^(微信)$
# windowrule = opacity 1 1, class:^(wechat)$, title:^(wechat)$

# partly fix wechat context blur ...
windowrule = border_size 0, no_shadow on, no_screen_share on, match:class ^(wechat)$
# windowrule = noblur, class:^(wechat)$

# clock
windowrule = float on, size (monitor_w*0.6) (monitor_h*0.6), match:class (org.gnome.clocks)

# mpv
windowrule = size (monitor_w*0.75) (monitor_h*0.75), center on, match:class ^([Mm]pv)$

# wps
windowrule = no_blur on, no_rounding on, match:class ^(wpp|et)$
windowrule = no_blur on, no_shadow on, border_size 0, match:class ^(wpsoffice)$
windowrule = no_rounding on, no_blur on, no_shadow on, border_size 0, match:class ^(wps)$, match:title (wps)


# qbittorrent
windowrule = float on, center on, match:class ^(org.qbittorrent.qBittorrent)$
windowrule = size (monitor_w*0.65) (monitor_h*0.75), match:class ^(org.qbittorrent.qBittorrent)$, match:title ^(qBittorrent Enhanced Edition (.*))$
# windowrule = opacity 0.95 0.9, class:^(org.qbittorrent.qBittorrent)$, title:^(qBittorrent Enhanced Edition (.*))$

# sioyek
windowrule = float on, center on, match:class ^(sioyek)$
# windowrule = opacity 1 1, class: ^(sioyek)$
windowrule = size (monitor_w*0.8) (monitor_h*0.8), match:class ^(sioyek)$, match:title (.*pdf)
# windowrule = nodim, class: ^(sioyek)$

# evince
windowrule = size (monitor_w*0.7) (monitor_h*0.7), center on, match:class (org.gnome.Evince|org.kde.okular)

# xdg: file picker
windowrule = no_blur on, border_size 0, no_shadow on, match:class ^(Xdg-desktop-portal-gtk)$

# pot-desktop
windowrule = float on, match:class (Pot), match:title (Translate|OCR|PopClip|Screenshot Translate|Recognize) # Translation window floating
windowrule = size (monitor_w*0.2) (monitor_h*0.5), move ((monitor_w*0.75)) ((monitor_h*0.08)), match:class (Pot), match:title (Translate)
# windowrule = move 70% 5%, class:(Pot), title:(Translate)
windowrule = size (monitor_w*0.4) (monitor_h*0.3), center on, match:class (Pot), match:title (Recognize)
# windowrule = move cursor 0 0, class:(pot), title:(Translator|PopClip|Screenshot Translate) # Translation window follows the mouse position.

#amberol
windowrule = float on, size 360 660, move ((monitor_w*0.75)) ((monitor_h*0.05)), match:class (io.bassi.Amberol)

# g4music
windowrule = float on, size 342 575, move ((monitor_w*0.75)) ((monitor_h*0.05)), match:class (com.github.neithern.g4music)

# wemeet 
windowrule = center on, float on, match:class (wemeetapp), match:title (腾讯会议)
windowrule = center on, match:class (wemeetapp), match:title (设置)
windowrule = no_blur on, no_shadow on, border_size 0, no_anim on, match:class (wemeetapp), match:title ^(wemeetapp|EmojiFloatWnd)$
windowrule = border_size 0, match:class (wemeetapp), match:title ^(InMeeting_Float_Tips)$

# zathura
windowrule = float on, size (monitor_w*0.8) (monitor_h*0.8), match:class (org.pwmt.zathura)

# matplotlib
windowrule = float on, match:class (Matplotlib)
windowrule = no_blur on, no_shadow on, border_size 0, no_rounding on, match:class (Toplevel)

# vscode
windowrule = float on, match:class (code)
windowrule = tile on, match:class (code), match:title ^.*Visual.*

# remove screenshot selection outline
layerrule = no_anim on, match:namespace hyprpicker
layerrule = no_anim on, match:namespace selection
layerrule = unset on, match:namespace Google-chrome

# localsend
windowrule = float on, size (monitor_w*0.6) (monitor_h*0.7), match:class (localsend)

# kitty
# blur only for kitty
windowrule = no_blur on, match:class negative:(kitty|kitty-dropterm)
windowrule = opacity 0.9 0.8 0.9, match:class ^(kitty|kitty-dropterm)$ # Terminals

# rustdesk
windowrule = float on, match:class ([Rr]ustdesk)
windowrule = tile on, match:class ([Rr]ustdesk), match:title ^(.*)(- Remote Desktop - RustDesk)

# zotero
windowrule = tile on, match:class Zotero, match:title ([Zz]otero)
windowrule = float on, match:class Zotero, match:title negative:(Zotero)
windowrule = center on, match:class Zotero

# steam
windowrule = float on, match:class (steam), match:title (Friends List|Steam Settings)

# filezilla
windowrule = float on, center on, match:class (filezilla)
windowrule = size (monitor_w*0.8) (monitor_h*0.8), match:class (filezilla), match:title ^(.*)(FileZilla)

# wlogout
layerrule = blur on, match:namespace logout_dialog

# thunderbird
windowrule = float on, size (monitor_w*0.8) (monitor_h*0.8), match:class (net.thunderbird.Thunderbird)
windowrule = float on, size (monitor_w*0.8) (monitor_h*0.8), match:title ^(.*)(Mozilla Thunderbird|Thunderbird)

# thunar
windowrule = float on, size (monitor_w*0.7) (monitor_h*0.7), match:class ([Tt]hunar|org.kde.dolphin)

# waydroid
windowrule = float on, match:class (Waydroid|waydroid.(.*))

# moderngl manim
windowrule = float on, match:class (ModernGL)

# flclash
windowrule = float on, size (monitor_w*0.7) (monitor_h*0.7), match:class (com.follow.clash)

# kdialog
windowrule = float on, center on, match:class (org.kde.kdialog)

